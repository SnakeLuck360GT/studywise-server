<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/style.css"><link rel="icon" href="/icon.svg"><title>Make an account · Studywise courses</title></head>
<body>
<header class="top"><a class="brand" href="/"><span class="dot"></span>Studywise courses</a><nav class="links"></nav></header>
<main class="narrow">
  <h1>Make an account</h1>
  <form class="card" id="form">
    <div class="error" id="error" hidden></div>
    <label for="name">Username</label>
    <input id="name" name="name" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
    <div id="invite-box" hidden>
      <label for="invite">Invite code</label>
      <input id="invite" name="invite" autocomplete="off" spellcheck="false">
    </div>
    <div class="notice" id="closed" hidden>Sign-ups are closed on this site for now.</div>
    <p class="muted small">Your username is shown on the weeks you publish. Passwords need at least 8 characters.</p>
    <button type="submit">Make an account</button>
  </form>
  <p class="muted">Have one already? <a href="/login">Log in</a></p>
</main>
<script type="module" src="/signup.js"></script>
</body>
</html>
